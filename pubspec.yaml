name: ayni_app
description: "Aplicación móvil para detección temprana de plagas en hojas de café"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.5
  flutter_riverpod: ^2.6.1
  connectivity_plus: ^6.1.4
  image_picker: ^1.1.2
  image: ^4.2.0
  intl: ^0.19.0
  tflite_flutter: ^0.12.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
