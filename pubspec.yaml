name: ayni_app
description: "Aplicación móvil para detección temprana de plagas en hojas de café"
publish_to: 'none'

version: 1.0.5

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.5
  sqflite: ^2.4.1
  path: ^1.9.0
  flutter_riverpod: ^2.6.1
  dio: ^5.7.0
  connectivity_plus: ^6.1.4
  image_picker: ^1.1.2
  image: ^4.2.0
  intl: ^0.19.0
  tflite_flutter: ^0.12.1

  # Firebase (HU13 - push notifications, E09 - crashlytics)
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  firebase_crashlytics: ^4.1.3
  flutter_local_notifications: ^17.2.4

  # Reportes y compartir
  pdf: ^3.11.1
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  package_info_plus: ^8.1.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 26
